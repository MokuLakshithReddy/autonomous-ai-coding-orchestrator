name: Live LLM Autonomous Repair Integration

on:
  schedule:
    # Run nightly at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running unscripted LLM repair verification'
        required: false
        default: 'Manual unscripted live LLM verification'

jobs:
  live-llm-repair:
    name: Unscripted Gemini Autonomous Repair
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript Project
        run: npm run build

      - name: Safe Credential Preflight Check
        env:
          KEY_VAL: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY_VAL" ]; then
            echo "::error::[Preflight Check Failed] Secret GEMINI_API_KEY is not configured in GitHub repository secrets."
            echo "To configure: Go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret -> Name: GEMINI_API_KEY"
            exit 1
          fi
          KEY_LEN=${#KEY_VAL}
          echo "✓ Credential Preflight Passed: GEMINI_API_KEY is configured ($KEY_LEN characters, value masked)."

      - name: Execute Live LLM Autonomous Repair Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUIRE_LLM: 'true'
        run: |
          npm run test:llm
          npm run test:benchmarks:live

      - name: Archive Benchmark Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-llm-benchmark-report
          path: |
            benchmark-report.json
            benchmark-report.md

