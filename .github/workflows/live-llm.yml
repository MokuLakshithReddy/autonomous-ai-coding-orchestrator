name: Live LLM Autonomous Repair Integration

on:
  schedule:
    # Run nightly at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running unscripted LLM repair verification'
        required: false
        default: 'Manual unscripted live LLM verification'

jobs:
  live-llm-repair:
    name: Unscripted Gemini Autonomous Repair
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript Project
        run: npm run build

      - name: Execute Live LLM Autonomous Repair Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUIRE_LLM: 'true'
        run: npm run test:llm

