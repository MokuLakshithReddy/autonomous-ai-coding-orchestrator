name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.12.0', '22.x']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Typecheck & Build Backend
        run: |
          npm run typecheck
          npm run build

      - name: Run Critical P0/P1 Correctness & Security Tests
        run: npm test

      - name: Run Autonomous Repair Benchmarks
        run: npm run test:benchmarks

      - name: Run 24-Task Deterministic Benchmark Suite
        run: npm run benchmark

      - name: Install & Build Web Dashboard
        working-directory: ./web
        run: |
          npm ci
          npm run build
